<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdilBingo WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-bar {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 450px;
            background: #1e293b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
        }
        .header-bar div span {
            color: #38bdf8;
        }
        .instruction {
            text-align: center;
            font-size: 14px;
            margin-bottom: 10px;
            color: #cbd5e1;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            width: 100%;
            max-width: 450px;
            max-height: 250px;
            overflow-y: auto;
            padding: 5px;
            background: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .card-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 10px 0;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
        }
        .card-btn.selected {
            background: #22c55e;
            color: black;
        }
        .selected-preview {
            width: 100%;
            max-width: 450px;
            margin-top: 10px;
            background: #1e293b;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            min-height: 40px;
            color: #a7f3d0;
        }
        .confirm-btn {
            width: 100%;
            max-width: 450px;
            background: #22c55e;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        #countdown-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 999;
        }
        #countdown-number {
            font-size: 80px;
            font-weight: bold;
            color: #facc15;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div>SOLD: <span id="sold-count">0</span></div>
        <div>TIME: <span id="timer-display">30s</span></div>
        <div>BAL: <span id="balance-display">500 ETB</span></div>
    </div>

    <div class="instruction" id="instruction-text">ከታች ካሉት ካርዶች ውስጥ እስከ 2 ካርዶች ይምረጡ:</div>

    <div class="grid-container" id="cards-grid"></div>

    <div class="selected-preview">
        <strong>የመረጧቸው ካርዶች:</strong> <span id="selected-list">ምንም አልተመረጠም</span>
    </div>

    <button class="confirm-btn" onclick="confirmSelection()">ጨዋታውን ጀምር (CONFIRM)</button>

    <div id="countdown-modal">
        <div style="color: white; font-size: 20px; margin-bottom: 20px;">ጨዋታው ሊጀምር ነው! ቁጥር መጥሪያ በሰከንድ ውስጥ ይጀመራል...</div>
        <div id="countdown-number">3</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomType = urlParams.get('room') || 'regular';
        const totalCards = roomType === 'superbingo' ? 900 : 450;

        let selectedCards = [];
        let timeLeft = 30;
        let soldCount = 12;

        document.getElementById('sold-count').innerText = soldCount;
        document.getElementById('balance-display').innerText = "500 ETB";

        const timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-display').innerText = timeLeft + "s";
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                triggerGameStart();
            }
        }, 1000);

        const grid = document.getElementById('cards-grid');
        for (let i = 1; i <= totalCards; i++) {
            const btn = document.createElement('button');
            btn.className = 'card-btn';
            btn.innerText = i;
            btn.onclick = () => toggleCard(i, btn);
            grid.appendChild(btn);
        }

        function toggleCard(id, btn) {
            const index = selectedCards.indexOf(id);
            if (index > -1) {
                selectedCards.splice(index, 1);
                btn.classList.remove('selected');
            } else {
                if (selectedCards.length >= 2) {
                    alert("ከ 2 በላይ ካርዶች መምረጥ አይችሉም!");
                    return;
                }
                selectedCards.push(id);
                btn.classList.add('selected');
            }
            updatePreview();
        }

        function updatePreview() {
            const listSpan = document.getElementById('selected-list');
            if (selectedCards.length === 0) {
                listSpan.innerText = "ምንም አልተመረጠም";
            } else {
                listSpan.innerText = selectedCards.join(", ");
            }
        }

        function confirmSelection() {
            if (selectedCards.length === 0) {
                alert("እባክዎን ቢያንስ 1 ካርድ ይምረጡ!");
                return;
            }
            clearInterval(timerInterval);
            triggerGameStart();
        }

        function triggerGameStart() {
            const modal = document.getElementById('countdown-modal');
            const numDisplay = document.getElementById('countdown-number');
            modal.style.display = 'flex';
            
            let count = 3;
            numDisplay.innerText = count;

            const countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    numDisplay.innerText = count;
                } else if (count === 0) {
                    numDisplay.innerText = "GO!";
                } else {
                    clearInterval(countdownInterval);
                    alert("ካርዶችዎ ገብተዋል! ቁጥር መጥራት ተጀመረ...");
                    modal.style.display = 'none';
                }
            }, 1000);
        }
    </script>
</body>
</html>
