<!-- index.html -->

<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EdilBingo Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d1117; color: #ffffff; padding: 8px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .header-bar { display: flex; justify-content: space-between; align-items: center; background: #161b22; padding: 10px 14px; border-radius: 8px; border: 1px solid #30363d; font-weight: bold; font-size: 13px; margin-bottom: 8px; }
        .sold-val { color: #f85149; }
        .time-val { color: #e3b341; font-size: 16px; }
        .bal-val { color: #2ea043; }

        #selectionView { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        .instruction { text-align: center; font-size: 12px; color: #8b949e; margin-bottom: 8px; }
        .grid-container { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding-bottom: 10px; }
        .card-cell { background: #21262d; border: 1px solid #30363d; border-radius: 6px; text-align: center; padding: 12px 0; font-size: 13px; font-weight: bold; color: #c9d1d9; cursor: pointer; }
        .card-cell.selected { background: #2ea043; color: #fff; border-color: #3fb950; }

        .slots-container { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 8px; margin-top: auto; max-height: 230px; overflow-y: auto; }
        .slots-title { font-size: 11px; color: #8b949e; margin-bottom: 6px; text-align: center; }
        .slots-flex { display: flex; gap: 8px; justify-content: center; }
        .mini-card { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 6px; flex: 1; max-width: 170px; }
        .mini-card-title { font-size: 11px; font-weight: bold; text-align: center; color: #58a6ff; margin-bottom: 4px; }
        .mini-matrix { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; text-align: center; font-size: 9px; }
        .mini-matrix div { background: #21262d; padding: 3px 0; border-radius: 2px; color: #c9d1d9; }

        #gameView { display: none; flex-direction: column; flex: 1; gap: 8px; overflow: hidden; }
        .top-info-bar { display: flex; justify-content: space-between; background: #161b22; padding: 8px 12px; border-radius: 8px; border: 1px solid #30363d; font-size: 12px; font-weight: bold; text-align: center; }
        .top-info-bar span { color: #e3b341; }

        .ball-caller-box { display: flex; align-items: center; justify-content: space-between; background: #161b22; border: 1px solid #30363d; padding: 6px 14px; border-radius: 8px; }
        .current-ball { background: #e3b341; color: #0d1117; font-size: 22px; font-weight: 900; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(227, 179, 65, 0.5); }
        .recent-balls { display: flex; gap: 6px; }
        .recent-ball { background: #30363d; color: #c9d1d9; font-size: 11px; font-weight: bold; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        .main-play-area { display: flex; gap: 8px; flex: 1; overflow: hidden; }
        .master-board { width: 42%; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 4px; display: flex; flex-direction: column; justify-content: space-between; }
        .master-row { display: flex; gap: 2px; align-items: center; font-size: 9px; font-weight: bold; }
        .master-letter { width: 14px; text-align: center; color: #58a6ff; }
        .master-nums { display: flex; flex: 1; gap: 2px; }
        .master-num { flex: 1; background: #21262d; text-align: center; padding: 4px 0; border-radius: 2px; color: #484f58; }
        .master-num.called { background: #2ea043; color: #fff; font-weight: bold; }

        .player-cards-area { width: 58%; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
        .play-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 6px; position: relative; }
        .play-card-header { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; color: #58a6ff; margin-bottom: 4px; }
        .play-matrix { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; text-align: center; margin-bottom: 6px; }
        .play-tile { background: #21262d; border: 1px solid #30363d; border-radius: 4px; padding: 8px 0; font-size: 12px; font-weight: bold; cursor: pointer; }
        .play-tile.marked { background: #2ea043; border-color: #3fb950; color: #fff; }
        .play-tile.free { background: #8957e5; border-color: #a371f7; color: #fff; font-size: 9px; }
        .bingo-btn { width: 100%; background: #da3633; color: white; border: none; padding: 8px; border-radius: 6px; font-weight: 900; font-size: 13px; cursor: pointer; box-shadow: 0 0 8px rgba(218, 54, 51, 0.4); }

        .play-card.locked { filter: grayscale(1); opacity: 0.6; pointer-events: none; }
        .play-card.locked::after { content: "🔒 ካርዱ ታስሯል"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #da3633; color: #fff; padding: 6px 12px; font-size: 12px; font-weight: bold; border-radius: 6px; box-shadow: 0 0 10px rgba(0,0,0,0.8); }

        #winnerModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(13, 17, 23, 0.95); z-index: 999; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .winner-box { background: #161b22; border: 2px solid #e3b341; padding: 20px; border-radius: 12px; width: 90%; max-width: 340px; }
        .winners-list { max-height: 150px; overflow-y: auto; margin: 10px 0; text-align: left; }
        .winner-item { background: #21262d; border: 1px solid #30363d; padding: 8px; border-radius: 6px; margin-bottom: 6px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div>SOLD: <span id="soldCount" class="sold-val">0</span></div>
        <div>TIME: <span id="gameTimer" class="time-val">30s</span></div>
        <div>BAL: <span id="userBalance" class="bal-val">500 ETB</span></div>
    </div>

    <div id="selectionView">
        <div class="instruction">ከታች ከ450 ካርዶች ውስጥ እስከ 2 ካርዶች ይምረጡ:</div>
        <div class="grid-container" id="cardGrid"></div>
        <div class="slots-container">
            <div class="slots-title">የመረጧቸው ካርዶች (Slots):</div>
            <div class="slots-flex" id="selectedSlots">
                <span style="color: #484f58; font-size: 11px;">ምንም አልተመረጠም</span>
            </div>
        </div>
    </div>

    <div id="gameView">
        <div class="top-info-bar">
            <div>DERASH (80%): <span id="derashVal">0 ETB</span></div>
            <div>BALLS: <span id="ballsVal">0</span></div>
            <div>PLAYERS: <span id="playersVal">1</span></div>
        </div>

        <div class="ball-caller-box">
            <div style="font-size: 11px; color: #8b949e;">ያለፉት: <div class="recent-balls" id="recentBalls"></div></div>
            <div id="currentBall" class="current-ball">-</div>
        </div>

        <div class="main-play-area">
            <div class="master-board" id="masterBoard"></div>
            <div class="player-cards-area" id="playerCardsArea"></div>
        </div>
    </div>

    <div id="winnerModal">
        <div class="winner-box">
            <h2 style="color: #e3b341; margin-bottom: 6px;">🎉 BINGO! 🎉</h2>
            <p style="font-size: 12px; color: #8b949e;">የአሸናፊዎች ዝርዝር:</p>
            <div class="winners-list" id="winnersList"></div>
            <h3 id="wPrize" style="color: #2ea043; margin-top: 8px; font-size: 15px;"></h3>
            <p style="font-size: 11px; color: #8b949e; margin-top: 12px;">በ<span id="winTimer">15</span> ሰከንድ ውስጥ ወደ ካርድ መምረጫ ይመለሳል...</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const API_BASE = "http://localhost:8000";
        let selectedCards = [];
        let cardObjects = {};
        let currentPhase = "SELECTION";
        let lockedCardIds = new Set();

        const grid = document.getElementById('cardGrid');
        for (let i = 1; i <= 450; i++) {
            const cell = document.createElement('div');
            cell.className = 'card-cell';
            cell.innerText = i;
            cell.onclick = () => toggleCard(i, cell);
            grid.appendChild(cell);
        }

        async function toggleCard(cardId, cellElem) {
            const index = selectedCards.indexOf(cardId);
            if (index > -1) {
                selectedCards.splice(index, 1);
                delete cardObjects[cardId];
                cellElem.classList.remove('selected');
            } else {
                if (selectedCards.length >= 2) {
                    tg.showAlert("እስከ 2 ካርዶች ብቻ መምረጥ ይችላሉ!");
                    return;
                }
                selectedCards.push(cardId);
                cellElem.classList.add('selected');
                
                const res = await fetch(`${API_BASE}/api/get-card-data?card_id=${cardId}`);
                const data = await res.json();
                cardObjects[cardId] = data.card;

                await fetch(`${API_BASE}/api/select-card`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({card_id: cardId})
                });
            }
            renderSlots();
        }

        function renderSlots() {
            const container = document.getElementById('selectedSlots');
            container.innerHTML = '';
            if (selectedCards.length === 0) {
                container.innerHTML = '<span style="color: #484f58; font-size: 11px;">ምንም አልተመረጠም</span>';
                return;
            }

            selectedCards.forEach(cardId => {
                const card = cardObjects[cardId];
                if (!card) return;
                const mini = document.createElement('div');
                mini.className = 'mini-card';
                
                let matrixHTML = '<div class="mini-matrix">';
                const cols = ['B','I','N','G','O'];
                for(let r=0; r<5; r++) {
                    cols.forEach(c => {
                        matrixHTML += `<div>${card[c][r]}</div>`;
                    });
                }
                matrixHTML += '</div>';

                mini.innerHTML = `<div class="mini-card-title">ካርድ #${cardId}</div>${matrixHTML}`;
                container.appendChild(mini);
            });
        }

        function initMasterBoard() {
            const board = document.getElementById('masterBoard');
            board.innerHTML = '';
            const columns = [
                { l: 'B', min: 1, max: 15 },
                { l: 'I', min: 16, max: 30 },
                { l: 'N', min: 31, max: 45 },
                { l: 'G', min: 46, max: 60 },
                { l: 'O', min: 61, max: 75 }
            ];

            columns.forEach(col => {
                const row = document.createElement('div');
                row.className = 'master-row';
                let numsHTML = `<div class="master-letter">${col.l}</div><div class="master-nums">`;
                for (let n = col.min; n <= col.max; n++) {
                    numsHTML += `<div class="master-num" id="mb-${n}">${n}</div>`;
                }
                numsHTML += `</div>`;
                row.innerHTML = numsHTML;
                board.appendChild(row);
            });
        }
        initMasterBoard();

        setInterval(async () => {
            try {
                const res = await fetch(`${API_BASE}/api/game-state`);
                const state = await res.json();
                
                document.getElementById('soldCount').innerText = state.sold_count;
                document.getElementById('gameTimer').innerText = state.timer + 's';
                document.getElementById('derashVal').innerText = state.derash + ' ETB';
                document.getElementById('ballsVal').innerText = state.drawn_balls.length;
                document.getElementById('playersVal').innerText = state.players;

                lockedCardIds = new Set(state.locked_cards || []);
                updateCardLockUI();

                if (state.phase === "SELECTION" && currentPhase !== "SELECTION") {
                    currentPhase = "SELECTION";
                    document.getElementById('winnerModal').style.display = 'none';
                    document.getElementById('gameView').style.display = 'none';
                    document.getElementById('selectionView').style.display = 'flex';
                } else if (state.phase === "PLAYING" && currentPhase !== "PLAYING") {
                    currentPhase = "PLAYING";
                    document.getElementById('selectionView').style.display = 'none';
                    document.getElementById('gameView').style.display = 'flex';
                    renderPlayroomCards();
                } else if (state.phase === "WINNER" && currentPhase !== "WINNER") {
                    currentPhase = "WINNER";
                    if (state.winners && state.winners.length > 0) {
                        const wContainer = document.getElementById('winnersList');
                        wContainer.innerHTML = '';
                        state.winners.forEach(w => {
                            wContainer.innerHTML += `
                                <div class="winner-item">
                                    <b style="color: #e3b341;">${w.name}</b> - ካርድ #${w.card_id}<br>
                                    <small style="color: #8b949e;">${w.pattern}</small>
                                </div>
                            `;
                        });
                        
                        const winMsg = state.winners.length > 1 
                            ? `እኩል ተከፍሏል: ተወዳዳሪዎች ${state.winners.length} (እያንዳንዱ: ${state.prize_per_winner} ETB)`
                            : `የሽልማት መጠን: ${state.prize_per_winner} ETB`;

                        document.getElementById('wPrize').innerText = winMsg;
                        document.getElementById('winnerModal').style.display = 'flex';
                    }
                }

                if (state.phase === "WINNER") {
                    document.getElementById('winTimer').innerText = state.timer;
                }

                if (state.phase === "PLAYING") {
                    document.getElementById('currentBall').innerText = state.current_ball || '-';
                    const recentContainer = document.getElementById('recentBalls');
                    recentContainer.innerHTML = '';
                    (state.recent_balls || []).forEach(b => {
                        recentContainer.innerHTML += `<div class="recent-ball">${b}</div>`;
                    });

                    (state.drawn_balls || []).forEach(b => {
                        const el = document.getElementById(`mb-${b}`);
                        if (el) el.classList.add('called');
                    });
                }

            } catch(e) { console.error(e); }
        }, 1000);

        function renderPlayroomCards() {
            const area = document.getElementById('playerCardsArea');
            area.innerHTML = '';
            
            if (selectedCards.length === 0) selectedCards.push(1);

            selectedCards.forEach(async cardId => {
                if (!cardObjects[cardId]) {
                    const res = await fetch(`${API_BASE}/api/get-card-data?card_id=${cardId}`);
                    const data = await res.json();
                    cardObjects[cardId] = data.card;
                }
                const card = cardObjects[cardId];
                const cardEl = document.createElement('div');
                cardEl.className = 'play-card';
                cardEl.id = `play-card-${cardId}`;

                let matrixHTML = '<div class="play-matrix">';
                const cols = ['B','I','N','G','O'];
                for(let r=0; r<5; r++) {
                    cols.forEach(c => {
                        const val = card[c][r];
                        if (val === 'FREE') {
                            matrixHTML += `<div class="play-tile free marked">FREE</div>`;
                        } else {
                            matrixHTML += `<div class="play-tile" onclick="this.classList.toggle('marked')">${val}</div>`;
                        }
                    });
                }
                matrixHTML += '</div>';

                cardEl.innerHTML = `
                    <div class="play-card-header">
                        <span>ካርድ #${cardId}</span>
                        <span>10 ETB</span>
                    </div>
                    ${matrixHTML}
                    <button class="bingo-btn" id="bingo-btn-${cardId}" onclick="claimBingo(${cardId})">BINGO - Card #${cardId}</button>
                `;
                area.appendChild(cardEl);
            });
            updateCardLockUI();
        }

        function updateCardLockUI() {
            selectedCards.forEach(cardId => {
                const cardEl = document.getElementById(`play-card-${cardId}`);
                if (cardEl && lockedCardIds.has(cardId)) {
                    cardEl.classList.add('locked');
                }
            });
        }

        async function claimBingo(cardId) {
            const userName = tg.initDataUnsafe?.user?.first_name || "ተጫዋች";
            const res = await fetch(`${API_BASE}/api/claim-bingo`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({card_id: cardId, player_name: userName})
            });
            const data = await res.json();
            
            if (data.status === "false_bingo" || data.status === "locked") {
                tg.showAlert(data.message);
                lockedCardIds.add(cardId);
                updateCardLockUI();
            }
        }
    </script>
</body>
</html>
